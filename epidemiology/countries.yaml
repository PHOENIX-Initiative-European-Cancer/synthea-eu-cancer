# Tier-1 country reference data for synthea-eu-cancer
#
# Scope: EU-27 + EFTA-4 (the ECIS coverage area).
#
# Per-country fields:
#   iso_alpha2 / iso_alpha3 — ISO 3166-1
#   nuts0                   — NUTS level-0 code (= alpha-2, except EL for Greece)
#   eu27                    — EU member state (true) or EFTA (false)
#   primary_identifier      — FHIR Patient.identifier.system for the dominant
#                             national patient/insurance identifier
#
# Identifier-system URIs marked `TBD` need verification against the relevant
# national FHIR base IG (e.g. DE Basisprofile, NL Nictiz, CH Core, FR Core,
# IT IG, ES IG). Do NOT publish synthetic data with a TBD identifier system —
# either confirm the URI from the IG, or use an explicitly-namespaced placeholder
# such as `urn:synderai:placeholder:<country>:<id-kind>` and document it.
#
# Sources for reference data:
#   ISO 3166:  https://www.iso.org/obp/ui/
#   NUTS:      https://ec.europa.eu/eurostat/web/nuts
#   Eurostat demography (demo_pjan): https://ec.europa.eu/eurostat/databrowser/view/demo_pjan
#   National FHIR IGs:
#     DE — https://simplifier.net/basisprofil-de-r4
#     NL — https://simplifier.net/packages/nictiz.fhir.nl.r4.zib2020
#     CH — https://fhir.ch/ig/ch-core/
#     FR — https://hl7.fr/ig/fhir/core/
#     AT — https://www.elga.gv.at/cdaaustria/fhir/
#     IT — https://hl7italia.it/

countries:

